# pkgs-gcc.yaml: START
# Compilers for the gcc platforms (linux-64). Build-only.
# Uses the conda compiler functions instead of the bare gcc metapackage.
# These pull in sysroot_linux-64 which pins the glibc floor (cos7 / 2.17)
# so shared libs do not link against the build host newer glibc.
# NOTE: use double quotes around the lang -- single quotes are m4 quote chars.
# NOTE: no commas in these comments -- this file is m4_included as an
# m4_ifelse argument and a comma would split it into extra args.
# Runtime libs come via the compiler run-exports so there is no run: entry.
    - {{ compiler("c") }}
    - {{ compiler("cxx") }}
# pkgs-gcc.yaml: STOP
